<!doctype html>
<html lang="ru">
<head>
<script>try{var _t=new URLSearchParams(location.search).get("theme");if(["studio","maker","light"].indexOf(_t)>=0)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Sheet Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='10' width='56' height='44' rx='6' fill='%23d9a35a'/%3E%3Cg fill='%23121a17'%3E%3Crect x='12' y='18' width='12' height='12' rx='2'/%3E%3Crect x='26' y='18' width='12' height='12' rx='2'/%3E%3Crect x='40' y='18' width='12' height='12' rx='2'/%3E%3Crect x='12' y='34' width='12' height='12' rx='2'/%3E%3Crect x='26' y='34' width='12' height='12' rx='2'/%3E%3Crect x='40' y='34' width='12' height='12' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #121a17; --panel: #18221e; --panel2: #1e2a25; --line: #2f3f37; --text: #e8e2cf; --muted: #93a093;
  --gold: #e6b971; --accent: #d9a35a; --sel: #ffd27a; --bad: #ff8a6a; --ok: #9fc48c; --loop: #7fc4ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px "Trebuchet MS", "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
button, input, select, textarea { font: inherit; color: var(--text); }
button { background: #2a3a32; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { background: #33473d; }
button.primary { background: var(--accent); color: #1b1408; border-color: #b8853f; font-weight: 700; }
button.primary:hover { background: #e7b46c; }
button.on { border-color: var(--accent); color: var(--gold); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: #111915; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; min-width: 0; }
input[type=number] { width: 64px; }
input[type=checkbox] { accent-color: var(--accent); }
input[type=range] { accent-color: var(--accent); padding: 0; }
input[type=color] { padding: 0 2px; width: 38px; height: 26px; }
textarea { resize: vertical; width: 100%; font: 12px Consolas, monospace; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 4px 0 0; color: var(--gold); white-space: nowrap; }
header .sep { width: 1px; height: 22px; background: var(--line); }
#gameBtn { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
#gameBtn.none { border-color: var(--bad); color: var(--bad); }
#status { margin-left: auto; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 320px minmax(340px, .85fr); min-height: 0; }
section { min-height: 0; display: flex; flex-direction: column; }
#sheetCol { border-right: 1px solid var(--line); }
#midCol { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
#framesCol { background: var(--panel); }
.title { padding: 8px 10px 6px; color: var(--gold); font-weight: 700; display: flex; gap: 6px; align-items: center; }
.title .sub { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 10px 8px; }
.bar label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.block { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.hint { color: var(--muted); font-size: 11.5px; padding: 0 10px 8px; line-height: 1.4; }
.warn { color: var(--bad); }
#sheetWrap { flex: 1; min-height: 0; overflow: auto; padding: 0 10px 10px; position: relative; }
#sheetView { display: block; border: 1px solid var(--line); border-radius: 4px; }
#sheetInfo { padding: 0 10px 8px; color: var(--muted); }
#empty { position: absolute; inset: 0 10px 10px; display: grid; place-items: center; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 10px; pointer-events: none; padding: 10px; }
#empty b { color: var(--gold); font-size: 15px; display: block; margin-bottom: 6px; }
#player { display: block; margin: 0 auto; border: 1px solid var(--line); border-radius: 4px; max-width: 100%; }
.pbar { display: flex; gap: 5px; align-items: center; justify-content: center; padding: 6px 10px; flex-wrap: wrap; }
#frameLabel { color: var(--muted); text-align: center; padding: 0 10px 6px; }
.field { padding: 0 10px 7px; }
.field > label { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
.row { display: flex; gap: 6px; align-items: center; }
.row > .grow { flex: 1; }
.tabs { display: flex; margin: 0 10px 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 5px 4px; white-space: normal; }
.tabs button.on { background: #2a3a32; color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 8px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
.chip.cur { border-color: var(--accent); color: var(--gold); }
.chip.empty { border-style: dashed; opacity: .6; }
.seq { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 10px 6px; max-height: 96px; overflow: auto; }
.seq span { background: #2b2a1d; border: 1px solid var(--sel); color: var(--sel); border-radius: 4px; padding: 0 5px; font-size: 11.5px; cursor: grab; user-select: none; }
.seq span:hover { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.seq span.drag { opacity: .4; }
#thumbs { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 10px; display: grid; gap: 6px; align-content: start; user-select: none; }
.thumb { position: relative; background: var(--panel2); border: 2px solid transparent; border-radius: 6px; cursor: pointer; padding: 3px; }
.thumb:hover { border-color: #4d6155; }
.thumb.sel { border-color: var(--sel); background: #2b2a1d; }
.thumb.loop { box-shadow: 0 0 0 2px var(--loop); }
.thumb canvas { display: block; width: 100%; height: auto; border-radius: 3px; }
.thumb .n { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; background: rgba(0,0,0,.65); padding: 0 4px; border-radius: 3px; color: var(--muted); }
.thumb .o { position: absolute; right: 4px; top: 4px; font-size: 11px; font-weight: 700; background: var(--sel); color: #1b1408; padding: 0 5px; border-radius: 9px; display: none; }
.thumb.sel .o { display: block; }
.thumb .l { position: absolute; left: 4px; top: 4px; font-size: 10.5px; background: var(--loop); color: #0b1a26; padding: 0 4px; border-radius: 3px; font-weight: 700; }
#drop { position: fixed; inset: 0; background: rgba(18,26,23,.85); display: none; place-items: center; z-index: 9; color: var(--gold); font-size: 20px; border: 3px dashed var(--accent); }
body.dragging #drop { display: grid; }
#busy { position: absolute; right: 18px; top: 6px; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 6px; color: var(--gold); display: none; }
.modal { position: fixed; inset: 0; background: rgba(5,9,7,.72); display: none; place-items: center; z-index: 20; padding: 16px; }
.modal.open { display: grid; }
.dialog { background: var(--panel); border: 1px solid #4d6155; border-radius: 10px; width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.dialog .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dialog .head h2 { margin: 0; font-size: 16px; color: var(--gold); flex: 1; }
.dialog .content { overflow: auto; padding: 12px 14px 16px; line-height: 1.5; }
.dialog h3 { color: var(--gold); font-size: 14px; margin: 14px 0 4px; }
.dialog h3:first-child { margin-top: 0; }
.dialog p, .dialog li { margin: 4px 0; }
.dialog ul, .dialog ol { padding-left: 20px; margin: 4px 0; }
.dialog .tip { background: var(--panel2); border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 4px; margin: 6px 0; }
.dialog code { background: #111915; padding: 0 4px; border-radius: 3px; }
.recent { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.recent button { text-align: left; white-space: normal; }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
.ok-text { color: var(--ok); } .bad-text { color: var(--bad); }
[hidden] { display: none !important; }
@media (max-width: 1100px) {
  body { display: block; overflow: auto; height: auto; }
  main { display: flex; flex-direction: column; }
  section { flex: none; }
  #midCol { overflow: visible; border-right: 0; border-top: 1px solid var(--line); }
  #sheetWrap { max-height: 70vh; min-height: 260px; }
  #thumbs { max-height: 70vh; }
}

/* ---------- оформление в стиле SpriteAnim Studio (темы) ---------- */
:root, html[data-theme="studio"] {
  --bg: #0e1014; --panel: #12151b; --panel2: #171b23; --line: #262c38; --line2: #333b4a;
  --text: #e8ecf4; --muted: #98a2b4;
  --gold: #c9c4ff; --accent: #7c6cff; --sel: #4ad6c0;
  --bad: #ff5d6c; --ok: #43d08a; --loop: #4ad6c0;
  --on-accent: #ffffff; --acc-soft: rgba(124,108,255,.18);
  --sel-soft: rgba(74,214,192,.14); --sel-ink: #9ff0e2;
  --overlay: rgba(14,16,20,.92); --overlay2: rgba(6,7,11,.72);
}
html[data-theme="maker"] {
  --bg: #121a17; --panel: #18221e; --panel2: #1e2a25; --line: #2f3f37; --line2: #3d5347;
  --text: #e8e2cf; --muted: #93a093;
  --gold: #e6b971; --accent: #d9a35a; --sel: #ffd27a;
  --bad: #ff8a6a; --ok: #9fc48c; --loop: #7fc4ff;
  --on-accent: #241a0c; --acc-soft: rgba(217,163,90,.2);
  --sel-soft: rgba(255,210,122,.14); --sel-ink: #ffd27a;
  --overlay: rgba(18,26,23,.9); --overlay2: rgba(5,9,7,.72);
}
html[data-theme="light"] {
  --bg: #f5f1ea; --panel: #fffdf9; --panel2: #f3eee5; --line: #ded5c7; --line2: #cdc2b1;
  --text: #2b241f; --muted: #7b6f65;
  --gold: #7d1f35; --accent: #7d1f35; --sel: #b08d57;
  --bad: #a3251d; --ok: #4f7a4a; --loop: #b08d57;
  --on-accent: #ffffff; --acc-soft: rgba(125,31,53,.12);
  --sel-soft: rgba(176,141,87,.18); --sel-ink: #6d4f27;
  --overlay: rgba(245,241,234,.92); --overlay2: rgba(43,36,31,.35);
}
html, body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 13px; }
button {
  background: var(--panel2); border-color: var(--line2); border-radius: 10px;
  padding: 6px 11px; font-weight: 600; font-size: 12.5px;
}
button:hover { background: var(--panel); border-color: var(--line2); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
button.primary:hover { filter: brightness(1.08); }
button.on { border-color: var(--accent); color: var(--gold); }
input, select, textarea { background: var(--panel); border-color: var(--line2); border-radius: 9px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
header { background: var(--panel); border-bottom-color: var(--line); }
header h1 { color: var(--text); font-weight: 700; }
header .sep { background: var(--line); }
.tabs { border-color: var(--line2); border-radius: 10px; }
.tabs button.on { background: var(--panel2); color: var(--gold); }
.chip { background: var(--panel2); border-color: var(--line2); border-radius: 10px; }
.chip.cur { border-color: var(--accent); color: var(--gold); }
.title { color: var(--text); }
.title .sub { color: var(--muted); }
.seq span { background: var(--sel-soft); border-color: var(--sel); color: var(--sel-ink); }
.thumb { background: var(--panel2); border-radius: 10px; }
.thumb:hover { border-color: var(--line2); }
.thumb.sel { border-color: var(--sel); background: var(--sel-soft); }
.thumb .o { background: var(--sel); color: var(--on-accent); }
.thumb .l { background: var(--loop); color: var(--on-accent); }
#drop { background: var(--overlay); color: var(--gold); border-color: var(--accent); }
.modal { background: var(--overlay2); }
.dialog { border-color: var(--line2); border-radius: 14px; }
.dialog .head h2 { color: var(--text); }
.dialog h3 { color: var(--gold); }
.dialog .tip { border-left-color: var(--accent); background: var(--panel2); }
.dialog code { background: var(--panel); }
.box { background: var(--panel2); border-color: var(--line); border-radius: 10px; }
#busy { color: var(--gold); }
#status.ok { color: var(--ok); }
/* в светлой теме тёмный текст на золотых плашках читается лучше */
html[data-theme="light"] .thumb .o,
html[data-theme="light"] .thumb .l { color: #2b1a12; }
</style>
</head>
<body>
<header>
  <h1>Sprite Sheet Maker</h1>
  <button id="gameBtn" data-tt="gameTip"></button>
  <span class="sep"></span>
  <button id="openFiles" class="primary" data-t="openFiles" data-tt="openFilesTip"></button>
  <button id="openDir" data-t="openDir" data-tt="openDirTip"></button>
  <input id="dirPath" data-tp="dirPathPh" style="width:220px">
  <button id="loadPath" data-t="load"></button>
  <input id="fileInput" type="file" accept="image/*,video/*,.gif,.mp4,.webm,.mov,.m4v,.mkv" multiple hidden>
  <span id="status"></span>
  <button id="helpBtn" class="primary" data-t="help"></button>
</header>
<main>
  <!-- Лист / Sheet -->
  <section id="sheetCol">
    <div class="title"><span data-t="sheet"></span> <span class="sub" id="sheetSub"></span></div>
    <div class="bar">
      <label><span data-t="grid"></span> <select id="template"></select></label>
      <label><span data-t="cols"></span> <input id="cols" type="number" min="1" max="64" value="5"></label>
      <label><span data-t="rows"></span> <input id="rows" type="number" min="1" max="64" value="4"></label>
      <button id="fitSel" data-t="fitSel" data-tt="fitSelTip"></button>
    </div>
    <div class="bar">
      <label><span data-t="scale"></span> <select id="scale">
        <option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option>
        <option value="0.375">37.5%</option><option value="0.25">25%</option><option value="custom" data-t="custom"></option>
      </select></label>
      <label id="customScaleBox" hidden><input id="customScale" type="number" min="1" max="400" value="60">%</label>
      <label data-tt="cropTip"><input id="crop" type="checkbox" checked> <span data-t="crop"></span></label>
      <label data-tt="marginTip"><span data-t="margin"></span> <input id="margin" type="number" min="0" max="200" value="10"></label>
      <label data-tt="gapTip"><span data-t="gap"></span> <input id="gap" type="number" min="0" max="64" value="8"></label>
      <label><input id="gridLines" type="checkbox" checked> <span data-t="gridLines"></span></label>
    </div>
    <div id="sheetInfo"></div>
    <div id="sheetWrap">
      <canvas id="sheetView" width="10" height="10"></canvas>
      <div id="empty"><div><b data-t="emptyTitle"></b><span data-t="emptyText"></span></div></div>
      <div id="busy"></div>
    </div>
  </section>

  <!-- Просмотр и в игру / Preview and install -->
  <section id="midCol">
    <div class="block">
      <div class="title" data-t="preview"></div>
      <canvas id="player" width="290" height="290"></canvas>
      <div class="pbar">
        <button id="prev" data-tt="prevTip">◀︎</button>
        <button id="play" class="primary" data-tt="playTip"></button>
        <button id="next" data-tt="nextTip">▶︎</button>
      </div>
      <div class="pbar">
        <label class="row" data-tt="fpsTip">fps <input id="fps" type="number" min="1" max="60" value="12"></label>
        <input id="fpsRange" type="range" min="1" max="60" value="12" style="width:110px">
      </div>
      <div class="pbar">
        <select id="mode"><option value="loop" data-t="modeLoop"></option><option value="pingpong" data-t="modePing"></option></select>
        <select id="bg"><option value="checker" data-t="bgChecker"></option><option value="dark" data-t="bgDark"></option><option value="light" data-t="bgLight"></option><option value="ground" data-t="bgGround"></option></select>
        <select id="zoom"><option value="fit" data-t="zoomFit"></option><option value="1">1:1</option><option value="2">2×</option></select>
      </div>
      <div class="pbar"><label data-tt="footTip"><input id="footLine" type="checkbox" checked> <span data-t="footLine"></span></label><label data-tt="onionTip"><input id="onion" type="checkbox"> <span data-t="onion"></span></label></div>
      <div id="frameLabel"></div>
    </div>

    <div class="block">
      <div class="title"><span data-t="toGame"></span> <span class="sub" id="charCount"></span></div>
      <div id="noGame" class="hint"></div>
      <div id="gameArea">
        <div class="field" id="charField">
          <label data-t="charLabel"></label>
          <div class="row"><select id="charSel" class="grow"></select><button id="refresh" data-tt="refreshTip">⟳</button></div>
        </div>
        <div class="hint" id="charInfo"></div>
        <div id="unityBox" hidden>
          <div class="field">
            <label data-t="unityController"></label>
            <div class="row"><select id="unityController" class="grow"></select><button id="unityAssets" data-tt="refreshTip">⟳</button></div>
          </div>
          <div class="field">
            <label data-t="unityClip"></label>
            <select id="unityClip" style="width:100%"></select>
          </div>
          <div class="field">
            <label data-t="unityEvents"></label>
            <div id="eventRows"></div>
            <div class="row" style="margin-top:4px"><button id="eventAdd" data-t="eventAdd"></button></div>
            <div class="hint" data-t="eventsHint"></div>
          </div>
        </div>
        <div id="newSetBox">
          <div class="field"><label data-t="setFolder"></label><select id="setDir" style="width:100%"></select></div>
          <div class="field"><label data-t="setName"></label><div class="row"><input id="setName" class="grow" value="frames"><span style="color:var(--muted)">.tres</span></div></div>
        </div>
        <div class="chips" id="animChips"></div>
        <div class="field">
          <label data-t="animName"></label>
          <div class="row"><input id="animName" class="grow" list="animNames" value="walk"><label class="row" style="color:var(--muted)" data-tt="loopTip"><input id="animLoop" type="checkbox" checked> <span data-t="loop"></span></label></div>
          <datalist id="animNames"></datalist>
        </div>
        <div id="fitBox" class="field" hidden>
          <label data-t="walkScale"></label>
          <div class="row"><input id="walkScale" type="number" step="0.01" min="0.01" value="1" style="width:80px"><label class="grow" style="color:var(--muted)"><input id="autoScale" type="checkbox" checked> <span data-t="autoScale"></span></label></div>
        </div>
        <div id="hitBox" class="field" hidden>
          <label data-t="hitFrame"></label>
          <div class="row"><input id="hitFrame" type="number" min="1" value="6" style="width:64px"><button id="hitFromPlayer" class="grow" data-t="hitFromPlayer" data-tt="hitFromPlayerTip"></button></div>
        </div>
        <div class="hint" id="animHint"></div>
        <div class="field"><button id="installAnim" class="primary" style="width:100%" disabled data-t="installAnim"></button></div>
        <div class="field"><button id="removeAnim" style="width:100%" disabled data-t="removeAnim"></button></div>
      </div>
    </div>

    <div class="block">
      <div class="title" data-t="sheetFile"></div>
      <div class="field"><label data-t="folder"></label><select id="folder" style="width:100%"></select></div>
      <div class="field"><label data-t="fileName"></label><div class="row"><input id="fileName" class="grow" value="sheet"><span style="color:var(--muted)">.png</span></div></div>
      <div class="field" id="importField"><label data-tt="importTip"><input id="doImport" type="checkbox" checked> <span data-t="doImport"></span></label></div>
      <div class="field row">
        <button id="save" class="grow" disabled data-t="saveOnly" data-tt="saveOnlyTip"></button>
        <button id="undo" class="grow" disabled data-tt="undoTip"></button>
      </div>
    </div>
  </section>

  <!-- Кадры / Frames -->
  <section id="framesCol">
    <div class="title"><span data-t="frames"></span> <span class="sub" id="framesSub"></span></div>
    <div class="block">
      <div class="bar">
        <button id="selAll" data-t="selAll"></button><button id="selNone" data-t="selNone"></button>
        <label><input id="reverse" type="checkbox"> <span data-t="reverse"></span></label>
        <label style="margin-left:auto"><span data-t="thumbSize"></span> <input id="thumbSize" type="range" min="60" max="200" value="96" style="width:80px"></label>
      </div>
      <div class="bar">
        <label><span data-t="from"></span> <input id="from" type="number" min="1" value="1"></label>
        <label><span data-t="to"></span> <input id="to" type="number" min="1" value="1"></label>
        <button id="selRange" data-t="selRange" data-tt="selRangeTip"></button>
        <label><span data-t="every"></span> <input id="every" type="number" min="1" value="2"></label><button id="selEvery" data-t="everyBtn"></button>
      </div>
      <div class="bar">

      const steps = [];
      for (let k = 1; k < times.length; k++) if (times[k] > times[k - 1]) steps.push(times[k] - times[k - 1]);
      steps.sort((a, b) => a - b);
      const step = steps.length ? steps[0] : 0;
      resolve(step > 0 ? Math.round(1 / step * 100) / 100 : 0);
    };
    const each = (now, meta) => { times.push(meta.mediaTime); if (times.length < 14) video.requestVideoFrameCallback(each); else finish(); };

    ctx.font = '11px Trebuchet MS'; ctx.textBaseline = 'top';
    for (let n = 0; n < s.cells; n++) {
      const x = (n % s.cols) * s.stepW * k + 3, y = Math.floor(n / s.cols) * s.stepH * k + 3;
      ctx.fillStyle = n < s.n ? 'rgba(0,0,0,.6)' : 'rgba(80,20,10,.6)';
      ctx.fillRect(x, y, 20, 14);
      ctx.fillStyle = n < s.n ? '#e6b971' : '#ff8a6a';
      ctx.fillText(n < s.n ? n + 1 : '—', x + 3, y + 1);
    }
  }
  const empty = s.cells - s.n;
  let info = t('sheetInfo', s.canvas.width, s.canvas.height, s.cols, s.rows, s.n, s.cellW, s.cellH) + (s.stepW !== s.cellW ? t('gapInfo', s.stepW - s.cellW) : '');
  if (s.dropped > 0) info += '<br><span class="warn">' + t('dropped', s.dropped) + '</span>';
  if (empty > 0 && isFinite(gridFor(1).cells)) info += '<br><span class="warn">' + t('emptyCells', empty) + '</span>';
  if (Math.max(s.canvas.width, s.canvas.height) > WARN_SIDE) info += '<br><span class="warn">' + t('bigSide', WARN_SIDE) + '</span>';
  $('sheetInfo').innerHTML = info;
  $('sheetSub').textContent = s.cols + '×' + s.rows;
}
new ResizeObserver(() => drawSheet()).observe($('sheetWrap'));

// ---------- просмотр / preview ----------
const BG = {dark: '#121a17', light: '#d9d9d1', ground: '#6b5434'};
function drawPlayer() {
  const canvas = $('player');
  const ctx = canvas.getContext('2d');
  const s = state.sheet;
  const W = canvas.width, H = canvas.height;
  if ($('bg').value === 'checker') checker(ctx, W, H, 12); else { ctx.fillStyle = BG[$('bg').value]; ctx.fillRect(0, 0, W, H); }
  if (!s) { $('frameLabel').textContent = ''; return; }
  const z = $('zoom').value;
  const k = z === 'fit' ? Math.min((W - 10) / s.stepW, (H - 10) / s.stepH) : Number(z);
  const dw = s.stepW * k, dh = s.stepH * k;
  const ox = (W - dw) / 2, oy = (H - dh) / 2;
  ctx.imageSmoothingQuality = 'high';
  const cell = (n) => [(n % s.cols) * s.stepW, Math.floor(n / s.cols) * s.stepH];
  if ($('onion').checked && s.n > 1) {
    const prev = ($('mode').value === 'pingpong' ? state.frame - state.dir : state.frame - 1 + s.n) % s.n;
    const [px, py] = cell(Math.max(0, prev));
    ctx.globalAlpha = 0.3; ctx.drawImage(s.canvas, px, py, s.stepW, s.stepH, ox, oy, dw, dh); ctx.globalAlpha = 1;
  }
  const [sx, sy] = cell(state.frame);
  ctx.drawImage(s.canvas, sx, sy, s.stepW, s.stepH, ox, oy, dw, dh);
  if ($('footLine').checked) {
    const y = Math.round(oy + s.foot * dh) + .5;
    ctx.strokeStyle = 'rgba(127,196,255,.8)'; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
  }
  const fps = Number($('fps').value) || 12;
  const cycle = ($('mode').value === 'pingpong' ? Math.max(1, 2 * s.n - 2) : s.n) / fps;
  const hitShown = !$('hitBox').hidden && state.frame + 1 === Number($('hitFrame').value);
  $('frameLabel').textContent = t('frameLabel', state.frame + 1, s.n, cycle.toFixed(2)) + (hitShown ? t('hitMark') : '');
}
function advance(step) {
  const s = state.sheet; if (!s || s.n < 1) return;
  if ($('mode').value === 'pingpong' && s.n > 1) {
    let f = state.frame + state.dir * step;
    if (f >= s.n) { state.dir = -1; f = s.n - 2; } else if (f < 0) { state.dir = 1; f = 1; }
    state.frame = Math.max(0, Math.min(s.n - 1, f));
  } else state.frame = ((state.frame + step) % s.n + s.n) % s.n;
  drawPlayer();
}
function tick(now) {
  if (!state.playing) return;
  const fps = Math.max(1, Number($('fps').value) || 12);
  state.clock += (now - state.last) / 1000; state.last = now;
  while (state.clock >= 1 / fps) { state.clock -= 1 / fps; advance(1); }
  requestAnimationFrame(tick);
}
function showPlay() { $('play').textContent = t(state.playing ? 'pause' : 'play'); }
function play() { if (!state.sheet) return; state.playing = true; state.last = performance.now(); state.clock = 0; showPlay(); requestAnimationFrame(tick); }
function stop() { state.playing = false; showPlay(); }
$('play').onclick = () => state.playing ? stop() : play();
$('prev').onclick = () => { stop(); advance(-1); };
$('next').onclick = () => { stop(); advance(1); };
$('fps').oninput = () => { $('fpsRange').value = $('fps').value; updateOutputs(); drawPlayer(); persist(); };
$('fpsRange').oninput = () => { $('fps').value = $('fpsRange').value; updateOutputs(); drawPlayer(); persist(); };
for (const id of ['mode', 'bg', 'zoom', 'footLine', 'onion']) $(id).onchange = () => { state.dir = 1; drawPlayer(); persist(); };
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { for (const m of document.querySelectorAll('.modal.open')) m.classList.remove('open'); return; }
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.querySelector('.modal.open')) return;
  if (event.code === 'Space') { event.preventDefault(); state.playing ? stop() : play(); }
  else if (event.code === 'ArrowLeft') { stop(); advance(-1); }
  else if (event.code === 'ArrowRight') { stop(); advance(1); }
});

// ---------- выходы / outputs ----------
const round4 = (v) => Math.round(v * 10000) / 10000;
// Рост как у неподвижного рисунка персонажа из данных: первый кадр ролика —
// тот же рисунок, так что (foot − top) · scale рисунка = рост фигуры в клетке
// / шаг клетки · scale листа.
function fittedScale(s, fit) { return round4((fit.sprite_foot - fit.sprite_top) * fit.sprite_scale * s.stepH / Math.max(1, s.figure * s.k)); }
const hitFrame = () => Math.max(1, Math.min(state.sheet ? state.sheet.n : 1, Math.round(Number($('hitFrame').value) || 1)));
// Всё, что сборщик может посчитать для персонажа из данных; игра берёт нужное.
function dataValues() {
  const s = state.sheet, c = currentChar();
  const fps = Math.max(1, Number($('fps').value) || 12);
  return {cols: s.cols, rows: s.rows, frames: s.n, fps, hit_frame: hitFrame(),
    stride: c && c.speed > 0 ? round4(c.speed * s.n / fps) : 1,
    sprite_scale: Math.max(0.01, Number($('walkScale').value) || 1), sprite_foot: round4(s.foot), sprite_top: round4(s.top)};
}
function updateOutputs() {
  const s = state.sheet, p = state.project, c = currentChar();
  const isNew = $('charSel').value === 'new';
  const name = animName();
  const a = charAnim(c, name);
  const ready = !!s && !state.pending && !!p;
  const unity = isUnity();
  $('save').disabled = !ready;
  $('installAnim').disabled = !ready || !name
    || (!unity && !c && !isNew) || (!unity && isData(c) && !a);
  $('walkScale').disabled = $('autoScale').checked;
  // Подсказка: заменится или добавится, и что посчитано для игры.
  let hint = '';
  if (isData(c) && !a) hint = t('dataUnknownAnim', c.animations.map((x) => x.name).join(', '));
  else if (name) hint = (a && (!isData(c) || a.installed)) ? t('animExists', name, a.frames) : t('animNew', name);
  if (s && isData(c) && a) {
    if (a.fit && $('autoScale').checked) $('walkScale').value = fittedScale(s, c.fit);
    $('hitFrame').max = s.n;
    if (Number($('hitFrame').value) > s.n) $('hitFrame').value = s.n;
    const v = dataValues();
    if (a.stride) hint += ' ' + t('strideHint', c.speed, v.fps, v.stride);
    if (a.hit) {
      const length = s.n / v.fps, interval = c.interval || 0;
      hint += ' ' + t('attackHint', s.n, v.fps, length.toFixed(2), interval || '?', v.hit_frame) + (interval && length > interval ? t('attackHintFast', (length / interval).toFixed(2)) : '');
    }
  }
  $('animHint').innerHTML = hint;
  drawPlayer();
}

  if (!sheetName()) { status(t('nameEmpty'), 'bad'); return; }
  const anim = animName();
  if (!anim) { status(t('animEmpty'), 'bad'); return; }
  return after(async () => {
    const exists = await sheetExists().catch(() => false);
    const fps = Math.max(1, Number($('fps').value) || 12);
    const file = atPath($('folder').value, sheetName() + '.png');
    const controllerPath = $('unityController').value || '';
    const clipPath = $('unityClip').value || '';
    const events = collectEvents();
    const target = [controllerPath, clipPath].filter(Boolean).join(' → ');
    const question = t('confirmInstallUnity', anim, file, exists ? t('replaceFile') : '', s.n, fps)
      + (target ? '\n' + t('confirmUnityTarget', target) : '');
    if (!confirm(question)) return;
    status(t('installing'));
    const params = {anim, fps, loop: $('animLoop').checked ? 1 : 0, dir: $('folder').value, name: sheetName(),
      overwrite: exists ? 1 : 0, cols: s.cols, frames: s.n, stepW: s.stepW, stepH: s.stepH,
      cellW: s.cellW, cellH: s.cellH, lead: s.lead, pixel: s.pixel ? 1 : 0, controller: 1,
      controllerPath, clipPath, events: JSON.stringify(events)};
    const answer = await api('/sheet/api/install?' + q(params), {method: 'POST', body: await png()});
    status(t('installedUnity', anim, answer.target), 'ok');
  });
}
$('installAnim').onclick = () => {
  if (isUnity()) return installUnitySheet();
  const s = state.sheet, c = currentChar(), isNew = $('charSel').value === 'new';
  if (!s || state.pending || (!c && !isNew)) return;
  if (!sheetName()) { status(t('nameEmpty'), 'bad'); return; }
  return after(async () => {
    const exists = await sheetExists();
    const anim = animName();
    const loop = $('animLoop').checked;
    const fps = Math.max(1, Number($('fps').value) || 12);
    const file = atPath($('folder').value, sheetName() + '.png');
    const newSet = 'res://' + ($('setDir').value ? $('setDir').value + '/' : '') + $('setName').value.trim().replace(/\.tres$/i, '') + '.tres';
    const where = isNew ? newSet : c.kind === 'scene' ? c.scene + ' → ' + c.node : c.kind === 'set' ? c.setRes : c.source + ' → ' + c.name;
    if (!confirm(t('confirmInstall', anim, isNew ? newSet.split('/').pop() : c.name, where, file, exists ? t('replaceFile') : '', s.n, fps, t(loop ? 'loopYes' : 'loopNo')))) return;
    status(t(isData(c) ? 'installingData' : 'installing'));
    const params = {char: isNew ? 'new' : c.id, anim, fps, loop: loop ? 1 : 0, dir: $('folder').value, name: sheetName(), overwrite: exists ? 1 : 0,
      import: $('doImport').checked ? 1 : 0, setDir: $('setDir').value, setName: $('setName').value.trim().replace(/\.tres$/i, ''),
      cols: s.cols, frames: s.n, stepW: s.stepW, stepH: s.stepH, cellW: s.cellW, cellH: s.cellH, lead: s.lead,
      values: isData(c) ? JSON.stringify(dataValues()) : ''};
    const answer = await api('/sheet/api/install?' + q(params), {method: 'POST', body: await png()});
    if (answer.select) state.selectAfter = answer.select;
    status(t('installedAnim', anim, answer.target, answer.created ? t('newSetMade') : '') + (answer.imported === false ? t('importedNo') : ''), answer.imported === false ? 'bad' : 'ok');
  });
};
$('removeAnim').onclick = () => {
  const c = currentChar(), anim = animName();
  if (!c || !confirm(t('confirmRemove', anim, c.name))) return;
  return after(async () => { await api('/sheet/api/remove?' + q({char: c.id, anim}), {method: 'POST'}); status(t('removed', anim), 'ok'); });
};
$('save').onclick = () => {
  if (!state.sheet || state.pending) return;
  if (!sheetName()) { status(t('nameEmpty'), 'bad'); return; }
  return after(async () => {
    const exists = await sheetExists();
    const file = atPath($('folder').value, sheetName() + '.png');
    if (exists && !confirm(t('fileExists', file))) return;
    const doImport = $('doImport').checked;
    status(t(doImport ? 'savingImport' : 'saving'));
    const answer = await api('/sheet/api/save?' + q({dir: $('folder').value, name: sheetName(), overwrite: exists ? 1 : 0, import: doImport ? 1 : 0}), {method: 'POST', body: await png()});
    const kb = Math.round(answer.bytes / 1024);
    status(answer.engine === 'unity' ? t('savedUnity', answer.file, kb)
      : t('saved', answer.file, kb) + (doImport ? (answer.imported ? t('importedOk') : t('importedNo')) : ''), doImport && !answer.imported ? 'bad' : 'ok');
  });
};
$('undo').onclick = () => {
  if (!confirm(t('confirmUndo'))) return;
  return after(async () => { const answer = await api('/sheet/api/undo', {method: 'POST'}); status(t('undone', answer.label), 'ok'); });
};

// ---------- запуск / start ----------
function setLang(next) {
  lang = next;
  store.set('lang', lang);
  fillTemplates();
  applyLang();
  showPlay();
  showKeySeen();
  refreshThumbs();
  showProject();
  drawSheet();
  drawPlayer();
}

// Язык приложения меняет и редактор — без перезагрузки страницы.
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'app-lang' && (d.lang === 'ru' || d.lang === 'en') && d.lang !== lang) setLang(d.lang);
});
fillTemplates();
restore();
applyTemplate();
$('nearVal').textContent = $('near').value;
$('template').onchange = () => { applyTemplate(); rebuild(); };
for (const id of ['cols', 'rows', 'margin', 'gap', 'customScale']) $(id).oninput = () => { if (/^(cols|rows)$/.test(id)) $('template').value = 'custom'; applyTemplate(); rebuild(); };
for (const id of ['scale', 'crop']) $(id).onchange = () => { scale(); rebuild(); };
$('gridLines').onchange = () => { drawSheet(); persist(); };
for (const id of ['keyOn', 'keyMode', 'pockets', 'clean']) $(id).onchange = () => rebuild();
$('keyColor').oninput = () => { $('keyMode').value = 'pick'; rebuild(); };
$('near').oninput = () => { $('nearVal').textContent = $('near').value; rebuild(); };
$('every').onchange = persist; $('evenly').onchange = persist;
scale();

$('openFiles').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => { loadFiles([...e.target.files]); e.target.value = ''; };
$('openDir').onclick = async () => {
  const answer = await api('/sheet/api/pick?' + q({kind: 'frames', start: $('dirPath').value.trim().replace(/^"|"$/g, '')}), {method: 'POST'}).catch(() => ({path: ''}));
  if (answer.path) loadPath(answer.path);
};
$('loadPath').onclick = () => loadPath();
$('dirPath').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadPath(); });
$('dirPath').value = store.get('dirPath', '');
let dragDepth = 0;
// Заставка «отпустите» — только для файлов снаружи, не для номеров в ленте.
const carriesFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', (e) => { if (!carriesFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragleave', (e) => { if (!carriesFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (!carriesFiles(e)) return;
  const items = [...(e.dataTransfer.items || [])];
  if (items.length && items[0].webkitGetAsEntry) { const {files, folder} = await entriesToFiles(items); loadFiles(files, folder); }
  else loadFiles([...e.dataTransfer.files]);
});

applyLang();
showPlay();
// Пока страница открыта, сервер знает, что он нужен; закрыли — сам выключится.
const ping = () => fetch('/sheet/api/ping', {method: 'POST'}).catch(() => {});
ping();
setInterval(ping, 10000);
window.addEventListener('pagehide', () => navigator.sendBeacon('/sheet/api/bye'));
api('/sheet/api/state').then((st) => {
  if (st.api !== API) status(t('oldServer'), 'bad');
  state.project = st.project; state.recent = st.recent || []; state.godot = st.godot;
  showProject();
  if (!state.project) showGameModal();
}).catch(() => status(t('noServer'), 'bad'));
updateOutputs();
drawPlayer();
// Открытие из SpriteAnim Studio: ?dir=<папка с кадрами>, ?name=<имя файла>,
// ?anim=<имя анимации> — чтобы лист и клип назывались как движение в студии.
try {
  const __params = new URLSearchParams(location.search);
  const __startDir = __params.get('dir');
  const __startName = __params.get('name');
  const __startAnim = __params.get('anim');
  if (__startName) $('fileName').value = __startName;
  if (__startAnim) $('animName').value = __startAnim;
  if (__startDir) setTimeout(async () => {
    await loadPath(__startDir);
    // loadFiles переименовывает лист по папке — возвращаем имя, заданное студией.
    if (__startName) { $('fileName').value = __startName; updateOutputs(); }
  }, 150);
} catch {}
</script>
</body>
</html>
